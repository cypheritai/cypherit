<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CypherIt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .tagline {
      color: #888;
      font-size: 0.8rem;
      margin-top: 4px;
    }
    
    .video-info {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    
    .video-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .video-url {
      font-size: 0.75rem;
      color: #00d9ff;
      word-break: break-all;
      opacity: 0.7;
    }
    
    .not-youtube {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    
    .not-youtube-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .not-youtube p {
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    
    .extract-btn {
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      color: #000;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .extract-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,217,255,0.3);
    }
    
    .extract-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .extract-btn.loading {
      background: linear-gradient(90deg, #00a0c0, #00cc70);
    }
    
    .open-site-btn {
      width: 100%;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(0,217,255,0.4);
      border-radius: 10px;
      background: transparent;
      color: #00d9ff;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    
    .open-site-btn:hover {
      background: rgba(0,217,255,0.1);
      border-color: #00d9ff;
    }
    
    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 0.8rem;
      color: #888;
    }
    
    .status.success {
      color: #00ff88;
    }
    
    .status.error {
      color: #ff6b6b;
    }
    
    .footer {
      text-align: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .footer a {
      color: #666;
      font-size: 0.75rem;
      text-decoration: none;
    }
    
    .footer a:hover {
      color: #00d9ff;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🔧 CypherIt</div>
    <div class="tagline">Skip the fluff. Get the fix.</div>
  </div>
  
  <div id="content">
    <!-- Dynamic content loaded by JS -->
  </div>
  
  <div class="footer">
    <a href="https://cypherit.ai" target="_blank">cypherit.ai</a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
