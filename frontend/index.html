<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CypherIt - Get the Fix in 60 Seconds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }
        
        .tagline {
            color: #aaa;
            font-size: 1.3rem;
            font-weight: 500;
        }
        
        .search-box {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        input[type="text"] {
            flex: 1;
            min-width: 280px;
            padding: 18px 24px;
            font-size: 1rem;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
            text-overflow: ellipsis;
        }
        
        input[type="text"]:focus {
            border-color: #00d9ff;
        }
        
        input[type="text"]::placeholder {
            color: #666;
            font-size: 0.95rem;
        }
        
        .primary-btn {
            padding: 18px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #000;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,217,255,0.3);
        }
        
        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .demo-section {
            margin-top: 20px;
            text-align: center;
        }
        
        .demo-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        
        .demo-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .demo-btn {
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .demo-btn:hover {
            border-color: #00d9ff;
            color: #fff;
            background: rgba(0,217,255,0.1);
            transform: translateY(-2px);
        }
        
        .demo-btn .emoji {
            margin-right: 6px;
        }
        
        .result {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 32px;
            display: none;
        }
        
        .result.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-header {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .result-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        
        .result-problem {
            color: #aaa;
            font-size: 1.05rem;
            line-height: 1.5;
        }
        
        .steps {
            list-style: none;
        }
        
        .step {
            display: flex;
            gap: 18px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .step:last-child {
            border-bottom: none;
        }
        
        .step-number {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #000;
            flex-shrink: 0;
        }
        
        .step-content {
            flex: 1;
            padding-top: 4px;
        }
        
        .step-action {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        
        .step-detail {
            color: #999;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .step-timestamp {
            display: inline-block;
            background: rgba(0,217,255,0.15);
            color: #00d9ff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            margin-top: 8px;
        }
        
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #666;
            font-size: 0.95rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .meta a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: 600;
        }
        
        .meta a:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            display: none;
        }
        
        .loading.visible {
            display: block;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        .loading p {
            color: #aaa;
            font-size: 1.1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(255,59,48,0.1);
            border: 1px solid rgba(255,59,48,0.3);
            border-radius: 12px;
            padding: 16px 20px;
            color: #ff6b6b;
            display: none;
            margin-top: 20px;
            font-size: 0.95rem;
        }
        
        .error.visible {
            display: block;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .tagline {
                font-size: 1.1rem;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            input[type="text"] {
                min-width: 100%;
            }
            
            .primary-btn {
                width: 100%;
            }
            
            .step-number {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            
            .step-action {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🔐 CypherIt</div>
            <p class="tagline">Get the fix in 60 seconds or less.</p>
        </header>
        
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Paste any YouTube tutorial link — we'll extract the steps instantly...">
                <button class="primary-btn" id="extractBtn" onclick="extract()">Get Steps</button>
            </div>
            
            <div class="demo-section">
                <p class="demo-label">✨ First time? Try one of these:</p>
                <div class="demo-buttons">
                    <button class="demo-btn" onclick="tryDemo(0)">
                        <span class="emoji">📱</span>iPhone Fix
                    </button>
                    <button class="demo-btn" onclick="tryDemo(1)">
                        <span class="emoji">🐍</span>Dev Setup
                    </button>
                    <button class="demo-btn" onclick="tryDemo(2)">
                        <span class="emoji">💻</span>Tech Tutorial
                    </button>
                </div>
            </div>
            
            <div class="error" id="error"></div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Decoding your fix... ✨</p>
        </div>
        
        <div class="result" id="result">
            <div class="result-header">
                <h2 class="result-title" id="resultTitle"></h2>
                <p class="result-problem" id="resultProblem"></p>
            </div>
            <ul class="steps" id="steps"></ul>
            <div class="meta">
                <span id="readTime"></span>
                <a href="#" id="sourceLink" target="_blank">Watch Full Video →</a>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = '';
        
        // Demo examples with real working YouTube videos
        const DEMO_EXAMPLES = [
            {
                name: "iPhone Fix",
                url: "https://www.youtube.com/watch?v=0HBA9Nov17Q"
            },
            {
                name: "Dev Setup", 
                url: "https://www.youtube.com/watch?v=kqtD5dpn9C8"
            },
            {
                name: "Tech Tutorial",
                url: "https://www.youtube.com/watch?v=Hc79sDi3f0U"
            }
        ];
        
        async function extract() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                showError('Please paste a YouTube URL to get started');
                return;
            }
            
            showLoading(true);
            hideError();
            hideResult();
            
            try {
                const response = await fetch(`${API_URL}/extract`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, max_steps: 6 })
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Extraction failed');
                }
                
                const data = await response.json();
                displayResult(data);
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }
        
        async function tryDemo(index) {
            const demo = DEMO_EXAMPLES[index];
            const input = document.getElementById('urlInput');
            
            // Auto-fill the URL
            input.value = demo.url;
            
            // Trigger extraction immediately
            await extract();
        }
        
        function displayResult(data) {
            document.getElementById('resultTitle').textContent = data.title;
            document.getElementById('resultProblem').textContent = data.problem;
            document.getElementById('readTime').textContent = `⏱️ ${data.time_to_read}`;
            document.getElementById('sourceLink').href = data.source_url;
            
            const stepsEl = document.getElementById('steps');
            stepsEl.innerHTML = data.steps.map(step => `
                <li class="step">
                    <div class="step-number">${step.number}</div>
                    <div class="step-content">
                        <div class="step-action">${step.action}</div>
                        ${step.detail ? `<div class="step-detail">${step.detail}</div>` : ''}
                        ${step.timestamp ? `<div class="step-timestamp">⏱️ ${step.timestamp}</div>` : ''}
                    </div>
                </li>
            `).join('');
            
            document.getElementById('result').classList.add('visible');
            
            // Smooth scroll to result
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('visible', show);
            document.getElementById('extractBtn').disabled = show;
            
            // Disable demo buttons while loading
            document.querySelectorAll('.demo-btn').forEach(btn => btn.disabled = show);
        }
        
        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = '⚠️ ' + msg;
            el.classList.add('visible');
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('visible');
        }
        
        function hideResult() {
            document.getElementById('result').classList.remove('visible');
        }
        
        // Enter key to submit
        document.getElementById('urlInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') extract();
        });
    </script>
</body>
</html>
