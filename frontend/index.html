<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CypherIt - Get the Fix in 60 Seconds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }
        
        .tagline {
            color: #aaa;
            font-size: 1.3rem;
            font-weight: 500;
        }
        
        .search-box {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        input[type="text"] {
            flex: 1;
            min-width: 280px;
            padding: 18px 24px;
            font-size: 1rem;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
            text-overflow: ellipsis;
        }
        
        input[type="text"]:focus {
            border-color: #00d9ff;
        }
        
        input[type="text"]::placeholder {
            color: #666;
            font-size: 0.95rem;
        }
        
        .primary-btn {
            padding: 18px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #000;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,217,255,0.3);
        }
        
        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .demo-section {
            margin-top: 20px;
            text-align: center;
        }
        
        .demo-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        
        .demo-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .demo-btn {
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .demo-btn:hover {
            border-color: #00d9ff;
            color: #fff;
            background: rgba(0,217,255,0.1);
            transform: translateY(-2px);
        }
        
        .demo-btn .emoji {
            margin-right: 6px;
        }
        
        .result {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 32px;
            display: none;
        }
        
        .result.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-header {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .result-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        
        .result-problem {
            color: #aaa;
            font-size: 1.05rem;
            line-height: 1.5;
        }
        
        .steps {
            list-style: none;
            scroll-snap-type: y proximity;
        }
        
        .step {
            display: flex;
            gap: 18px;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            min-height: 70vh; /* Each step fills most of the viewport */
            align-items: flex-start;
            scroll-snap-align: start;
        }
        
        .step:last-child {
            border-bottom: none;
            min-height: 50vh; /* Last step can be shorter */
        }
        
        .step-number {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #000;
            flex-shrink: 0;
        }
        
        .step-content {
            flex: 1;
            padding-top: 4px;
        }
        
        .step-action {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        
        .step-detail {
            color: #999;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .step-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }
        
        .step-timestamp {
            display: inline-block;
            background: rgba(0,217,255,0.15);
            color: #00d9ff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .step-timestamp:hover {
            background: rgba(0,217,255,0.3);
        }
        
        .sound-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .sound-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        
        .step-video {
            margin-top: 12px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            aspect-ratio: 16/9;
            max-width: 320px;
            position: relative;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        .step-video.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .step-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .step-caption {
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #e0e0e0;
            max-width: 320px;
            min-height: 60px;
            position: relative;
        }
        
        .step-caption .caption-text {
            white-space: pre-wrap;
        }
        
        .step-caption .caption-cursor {
            animation: blink 0.8s infinite;
            color: #00d9ff;
            font-weight: bold;
        }
        
        .step-caption.complete .caption-cursor {
            display: none;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .step-video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.9rem;
        }
        
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #666;
            font-size: 0.95rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .meta a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: 600;
        }
        
        .meta a:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            display: none;
        }
        
        .loading.visible {
            display: block;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        .loading p {
            color: #aaa;
            font-size: 1.1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(255,59,48,0.1);
            border: 1px solid rgba(255,59,48,0.3);
            border-radius: 12px;
            padding: 16px 20px;
            color: #ff6b6b;
            display: none;
            margin-top: 20px;
            font-size: 0.95rem;
        }
        
        .error.visible {
            display: block;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .tagline {
                font-size: 1.1rem;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            input[type="text"] {
                min-width: 100%;
            }
            
            .primary-btn {
                width: 100%;
            }
            
            .step-number {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            
            .step-action {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🔐 CypherIt</div>
            <p class="tagline">Get the fix in 60 seconds or less.</p>
        </header>
        
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Paste any YouTube tutorial link — we'll extract the steps instantly...">
                <button class="primary-btn" id="extractBtn" onclick="extract()">Get Steps</button>
            </div>
            
            <div class="demo-section" id="demoSection">
                <p class="demo-label">✨ First time? Try one of these:</p>
                <div class="demo-buttons" id="demoButtons">
                    <!-- Populated dynamically from /demos API -->
                    <span style="color: #666; font-size: 0.9rem;">Loading examples...</span>
                </div>
            </div>
            
            <div class="error" id="error"></div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Decoding your fix... ✨</p>
        </div>
        
        <div class="result" id="result">
            <div class="result-header">
                <h2 class="result-title" id="resultTitle"></h2>
                <p class="result-problem" id="resultProblem"></p>
            </div>
            <ul class="steps" id="steps"></ul>
            <div class="meta">
                <span id="readTime"></span>
                <a href="#" id="sourceLink" target="_blank">Watch Full Video →</a>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = '';
        
        // Demo examples - loaded from API
        let DEMO_EXAMPLES = [];
        
        // Load validated demos on page load
        async function loadDemos() {
            try {
                const response = await fetch(`${API_URL}/demos`);
                if (response.ok) {
                    const data = await response.json();
                    DEMO_EXAMPLES = data.demos;
                    renderDemoButtons();
                }
            } catch (err) {
                console.warn('Failed to load demos:', err);
                // Hide demo section if we can't load demos
                document.getElementById('demoSection').style.display = 'none';
            }
        }
        
        function renderDemoButtons() {
            const container = document.getElementById('demoButtons');
            if (!DEMO_EXAMPLES.length) {
                container.innerHTML = '<span style="color: #666;">No examples available</span>';
                return;
            }
            
            container.innerHTML = DEMO_EXAMPLES.map((demo, index) => `
                <button class="demo-btn" onclick="tryDemo(${index})">
                    <span class="emoji">${demo.emoji}</span>${demo.label}
                </button>
            `).join('');
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadDemos);
        
        async function extract() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                showError('Please paste a YouTube URL to get started');
                return;
            }
            
            showLoading(true);
            hideError();
            hideResult();
            
            try {
                const response = await fetch(`${API_URL}/extract`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, max_steps: 6 })
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Extraction failed');
                }
                
                const data = await response.json();
                displayResult(data);
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }
        
        async function tryDemo(index) {
            const demo = DEMO_EXAMPLES[index];
            if (!demo) {
                showError('Demo not available');
                return;
            }
            
            const input = document.getElementById('urlInput');
            input.value = demo.url;
            await extract();
        }
        
        // Convert timestamp string to seconds for YouTube embed
        function timestampToSeconds(ts) {
            if (!ts) return 0;
            const parts = ts.split(':').map(Number);
            if (parts.length === 2) return parts[0] * 60 + parts[1];
            if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
            return 0;
        }
        
        // Track which steps have loaded videos
        const loadedSteps = new Set();
        let currentVideoId = null;
        
        function displayResult(data) {
            document.getElementById('resultTitle').textContent = data.title;
            document.getElementById('resultProblem').textContent = data.problem;
            document.getElementById('readTime').textContent = `⏱️ ${data.time_to_read}`;
            document.getElementById('sourceLink').href = data.source_url;
            
            // Clean up any previous video state
            cleanupVideos();
            
            // Store video ID and timestamps for embeds
            currentVideoId = data.video_id;
            stepTimestamps = data.steps
                .filter(s => s.timestamp)
                .map(s => timestampToSeconds(s.timestamp));
            loadedSteps.clear();
            
            const stepsEl = document.getElementById('steps');
            stepsEl.innerHTML = data.steps.map((step, index) => `
                <li class="step" data-step-index="${index}" data-timestamp="${step.timestamp || ''}" data-end-time="${stepTimestamps[index + 1] || 9999}">
                    <div class="step-number">${step.number}</div>
                    <div class="step-content">
                        <div class="step-action">${step.action}</div>
                        ${step.detail ? `<div class="step-detail">${step.detail}</div>` : ''}
                        ${step.timestamp ? `
                            <div class="step-controls">
                                <div class="step-timestamp" onclick="jumpToTimestamp('${step.timestamp}')">
                                    ▶️ ${step.timestamp}
                                </div>
                                <button class="sound-btn" onclick="toggleSound(${index}, event)" title="Tap for sound">🔇</button>
                            </div>
                            <div class="step-video" id="step-video-${index}">
                                <div class="step-video-placeholder">Loading preview...</div>
                            </div>
                            ${step.caption ? `
                                <div class="step-caption" id="step-caption-${index}" data-full-text="${step.caption.replace(/"/g, '&quot;')}">
                                    <span class="caption-text"></span>
                                    <span class="caption-cursor">|</span>
                                </div>
                            ` : ''}
                        ` : ''}
                    </div>
                </li>
            `).join('');
            
            document.getElementById('result').classList.add('visible');
            
            // Smooth scroll to result
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            // Load videos sequentially (Step 1 first, then 2, etc.)
            loadVideosSequentially();
        }
        
        function jumpToTimestamp(ts) {
            const seconds = timestampToSeconds(ts);
            window.open(`https://www.youtube.com/watch?v=${currentVideoId}&t=${seconds}s`, '_blank');
        }
        
        // ============ VIDEO PLAYER STATE ============
        let activeStepIndex = null;
        const videoPlayers = {};
        let stepTimestamps = [];
        let boundaryCheckInterval = null;
        let ytApiReady = false;
        const pendingPlayers = [];
        
        // Load YouTube IFrame API
        const ytApiScript = document.createElement('script');
        ytApiScript.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(ytApiScript);
        
        window.onYouTubeIframeAPIReady = function() {
            console.log('YouTube IFrame API ready');
            ytApiReady = true;
            pendingPlayers.forEach(fn => fn());
            pendingPlayers.length = 0;
        };
        
        // ============ CLEANUP ============
        function cleanupVideos() {
            // Stop boundary checking
            if (boundaryCheckInterval) {
                clearInterval(boundaryCheckInterval);
                boundaryCheckInterval = null;
            }
            
            // Destroy all players
            Object.keys(videoPlayers).forEach(idx => {
                try {
                    videoPlayers[idx].destroy();
                } catch (e) {}
            });
            
            // Clear state
            Object.keys(videoPlayers).forEach(k => delete videoPlayers[k]);
            activeStepIndex = null;
            stepTimestamps = [];
            pendingPlayers.length = 0;
        }
        
        // ============ SEQUENTIAL LOADING ============
        function loadVideosSequentially() {
            const steps = document.querySelectorAll('.step[data-timestamp]');
            let delay = 500; // Start loading after 500ms
            
            steps.forEach((step, index) => {
                const timestamp = step.dataset.timestamp;
                if (timestamp && currentVideoId) {
                    setTimeout(() => {
                        loadVideoEmbed(index, timestamp);
                    }, delay);
                    delay += 800; // 800ms between each step load
                }
            });
            
            // Set up scroll observer for active step detection
            setupActiveStepObserver();
        }
        
        // ============ ACTIVE STEP OBSERVER ============
        function setupActiveStepObserver() {
            const options = {
                root: null,
                rootMargin: '-10% 0px -50% 0px', // Top 40% of viewport triggers
                threshold: 0.1
            };
            
            const observer = new IntersectionObserver((entries) => {
                // Find the TOPMOST intersecting step
                let topmostEntry = null;
                let topmostY = Infinity;
                
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const rect = entry.boundingClientRect;
                        if (rect.top < topmostY) {
                            topmostY = rect.top;
                            topmostEntry = entry;
                        }
                    }
                });
                
                if (topmostEntry) {
                    const index = topmostEntry.target.dataset.stepIndex;
                    if (activeStepIndex !== index) {
                        console.log(`Activating step ${index} (topmost visible)`);
                        setActiveStep(index);
                    }
                }
            }, options);
            
            document.querySelectorAll('.step[data-timestamp]').forEach(step => {
                if (step.dataset.timestamp) {
                    observer.observe(step);
                }
            });
            
            // Force Step 1 active on initial load
            setTimeout(() => {
                if (activeStepIndex === null) {
                    setActiveStep('0');
                }
            }, 1500);
        }
        
        // ============ SOUND STATE ============
        let userEnabledSound = false; // Track if user has tapped for sound
        
        // ============ ACTIVE STEP CONTROL ============
        function setActiveStep(index) {
            const idx = String(index);
            
            // Pause and mute ALL videos first
            Object.keys(videoPlayers).forEach(playerIdx => {
                try {
                    const player = videoPlayers[playerIdx];
                    player.pauseVideo();
                    player.mute();
                    
                    // Update sound button state
                    const btn = document.querySelector(`.step[data-step-index="${playerIdx}"] .sound-btn`);
                    if (btn) btn.textContent = '🔇';
                } catch (e) {}
            });
            
            activeStepIndex = idx;
            
            // Start caption typing animation
            startCaptionTyping(idx);
            
            // Play the active video
            if (videoPlayers[idx]) {
                try {
                    const player = videoPlayers[idx];
                    const step = document.querySelector(`.step[data-step-index="${idx}"]`);
                    const startTime = timestampToSeconds(step.dataset.timestamp);
                    
                    // Seek to start of this step's segment
                    player.seekTo(startTime, true);
                    player.playVideo();
                    
                    // Only unmute if user has tapped for sound (mobile autoplay policy)
                    if (userEnabledSound) {
                        player.unMute();
                        const btn = step.querySelector('.sound-btn');
                        if (btn) btn.textContent = '🔊';
                    }
                    
                    // Boundary check starts via onStateChange when player actually plays
                } catch (e) {
                    console.error('Error playing video:', e);
                }
            }
        }
        
        // ============ TOGGLE SOUND (user gesture) ============
        function toggleSound(index, event) {
            event.stopPropagation();
            const idx = String(index);
            const player = videoPlayers[idx];
            const btn = event.target;
            
            if (!player) return;
            
            try {
                if (player.isMuted()) {
                    userEnabledSound = true;
                    player.unMute();
                    btn.textContent = '🔊';
                } else {
                    player.mute();
                    btn.textContent = '🔇';
                }
            } catch (e) {
                console.error('Error toggling sound:', e);
            }
        }
        
        // ============ CAPTION TYPING ANIMATION ============
        let captionTypingInterval = null;
        
        function startCaptionTyping(index) {
            // Clear any existing typing animation
            if (captionTypingInterval) {
                clearInterval(captionTypingInterval);
            }
            
            const captionEl = document.getElementById(`step-caption-${index}`);
            if (!captionEl) return;
            
            const fullText = captionEl.dataset.fullText;
            if (!fullText) return;
            
            const textEl = captionEl.querySelector('.caption-text');
            captionEl.classList.remove('complete');
            
            let charIndex = 0;
            const typingSpeed = 30; // ms per character
            
            // Reset text
            textEl.textContent = '';
            
            captionTypingInterval = setInterval(() => {
                if (charIndex < fullText.length) {
                    textEl.textContent += fullText[charIndex];
                    charIndex++;
                } else {
                    clearInterval(captionTypingInterval);
                    captionEl.classList.add('complete');
                }
            }, typingSpeed);
        }
        
        // ============ BOUNDARY CHECKING (LOOP MODE) ============
        const MIN_SEGMENT_DURATION = 8; // Minimum 8 seconds per step segment
        
        function startBoundaryCheck(index) {
            const idx = String(index); // CRITICAL: videoPlayers uses string keys
            
            // Clear any existing interval
            if (boundaryCheckInterval) {
                clearInterval(boundaryCheckInterval);
            }
            
            const step = document.querySelector(`.step[data-step-index="${idx}"]`);
            if (!step || !step.dataset.timestamp) return;
            
            const startTime = timestampToSeconds(step.dataset.timestamp);
            let endTime = parseFloat(step.dataset.endTime) || (startTime + 30);
            
            // Ensure minimum segment duration
            if (endTime - startTime < MIN_SEGMENT_DURATION) {
                endTime = startTime + MIN_SEGMENT_DURATION;
            }
            
            console.log(`Step ${idx}: loop from ${startTime}s to ${endTime}s (${endTime - startTime}s segment)`);
            
            boundaryCheckInterval = setInterval(() => {
                if (activeStepIndex !== idx) {
                    console.log(`Step ${idx}: no longer active, stopping loop check`);
                    clearInterval(boundaryCheckInterval);
                    return;
                }
                
                const player = videoPlayers[idx]; // Use string key!
                if (!player) {
                    console.warn(`No player for step ${idx}`);
                    return;
                }
                
                try {
                    const currentTime = player.getCurrentTime();
                    
                    // LOOP: When reaching end of segment, seek back to start
                    if (currentTime >= endTime - 0.5) {
                        player.seekTo(startTime, true);
                        player.playVideo();
                    }
                } catch (e) {}
            }, 250); // Check every 250ms
        }
        
        // ============ VIDEO EMBED CREATION ============
        function loadVideoEmbed(index, timestamp) {
            const container = document.getElementById(`step-video-${index}`);
            if (!container) return;
            
            const seconds = timestampToSeconds(timestamp);
            const idx = String(index);
            
            container.innerHTML = `<div id="yt-player-${index}"></div>`;
            
            const createPlayer = () => {
                videoPlayers[idx] = new YT.Player(`yt-player-${index}`, {
                    videoId: currentVideoId,
                    playerVars: {
                        start: seconds,
                        autoplay: 1,
                        mute: 1,
                        modestbranding: 1,
                        rel: 0,
                        playsinline: 1,
                        controls: 1
                    },
                    events: {
                        onStateChange: (event) => {
                            // Start boundary check when player actually starts playing
                            if (event.data === YT.PlayerState.PLAYING && activeStepIndex === idx) {
                                startBoundaryCheck(idx);
                            }
                        },
                        onReady: (event) => {
                            // Start with lower quality for faster loading
                            try {
                                event.target.setPlaybackQuality('medium'); // 360p - fast load
                            } catch (e) {}
                            
                            // Play briefly to load the frame, then pause
                            event.target.playVideo();
                            
                            setTimeout(() => {
                                // If this is the first step and nothing is active, make it active
                                if (index === 0 && activeStepIndex === null) {
                                    setActiveStep('0');
                                } else if (activeStepIndex !== idx) {
                                    event.target.pauseVideo();
                                }
                            }, 600);
                        }
                    }
                });
            };
            
            if (ytApiReady && window.YT && window.YT.Player) {
                createPlayer();
            } else {
                pendingPlayers.push(createPlayer);
            }
            
            setTimeout(() => container.classList.add('visible'), 100);
        }
        
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('visible', show);
            document.getElementById('extractBtn').disabled = show;
            
            // Disable demo buttons while loading
            document.querySelectorAll('.demo-btn').forEach(btn => btn.disabled = show);
        }
        
        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = '⚠️ ' + msg;
            el.classList.add('visible');
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('visible');
        }
        
        function hideResult() {
            document.getElementById('result').classList.remove('visible');
            // Clean up videos when hiding results (new search starting)
            cleanupVideos();
        }
        
        // Enter key to submit
        document.getElementById('urlInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') extract();
        });
    </script>
</body>
